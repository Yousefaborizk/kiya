name: si_exporter_os
description: SI EXPORTER OS - Company Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──
  flutter_riverpod: ^2.6.1

  # ── Navigation ──
  go_router: ^14.8.1

  # ── Backend & Networking ──
  supabase_flutter: ^2.8.4
  http: ^1.6.0                      # تُستخدم الآن للاتصال المباشر بخدمة ترجمة جوجل

  # ── Localization ──
  easy_localization: ^3.0.7+1

  # ── UI & Design ──
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  font_awesome_flutter: ^10.8.0
  cupertino_icons: ^1.0.8

  # ── Media & WebView ──
  flutter_inappwebview: ^6.1.5
  flutter_facebook_auth: ^7.1.1

  # ── File Handling & Images ──
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  image: ^4.3.0

  # ── PDF & Archive ──
  pdf: ^3.11.1
  printing: ^5.13.4
  archive: ^3.6.1

  # ── Utils ──
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  gpt_markdown: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^ 4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/